<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신남연구소 · 열에너지 담벼락</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F9FF;
    --ink: #33415C;
    --ink-soft: #7186A6;
    --line: #DCEAFB;
    --card: #FFFFFF;
    --coral: #FF6F59;
    --coral-dark: #E85A45;
    --mint: #2EC4B6;
    --sun: #FFC53D;
    --note1: #FFF3B0;
    --note2: #FFD6E8;
    --note3: #C7F3DE;
    --note4: #CFE8FF;
    --note5: #E7DBFF;
    --note6: #FFDDB3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(var(--line) 1.4px, transparent 1.4px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 18px 90px; }

  .hero {
    background: linear-gradient(135deg, #6FD6E8 0%, #8FE3C0 100%);
    border-radius: 24px;
    padding: 30px 28px;
    color: #17384A;
    margin-bottom: 30px;
    box-shadow: 0 8px 0 rgba(23,56,74,0.08);
  }
  .hero .kicker {
    font-weight: 700;
    font-size: 13px;
    background: rgba(255,255,255,0.55);
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .hero h1 {
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
    font-size: 34px;
    margin: 0 0 10px;
    line-height: 1.3;
  }
  .hero p { margin: 0; font-size: 15px; max-width: 56ch; color: #1F4657; }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px 22px;
    margin-bottom: 30px;
    box-shadow: 0 4px 0 var(--line);
  }
  h2.section-title {
    font-family: 'Gaegu', sans-serif;
    font-size: 23px;
    font-weight: 700;
    margin: 0 0 16px;
    color: var(--ink);
  }

  form { display: grid; gap: 13px; }
  .row-grade { display: grid; grid-template-columns: 1fr 1fr 1fr 1.6fr; gap: 10px; }
  label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 5px; }
  input, select, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: #F7FBFF;
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 11px 13px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--mint);
  }
  .hint { font-size: 12.5px; color: var(--ink-soft); margin-top: -5px; }

  button.submit-btn {
    font-family: inherit;
    font-weight: 900;
    font-size: 15.5px;
    background: var(--coral);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    cursor: pointer;
    justify-self: start;
    box-shadow: 0 4px 0 var(--coral-dark);
  }
  button.submit-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--coral-dark); }
  button.submit-btn:disabled { opacity: 0.55; cursor: default; box-shadow: none; }

  .result-banner {
    display: none;
    margin-top: 2px;
    padding: 13px 16px;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 500;
  }
  .result-banner.approve { display: block; background: #E1F7EC; color: #1E7A4C; }
  .result-banner.reject { display: block; background: #FFE9E4; color: #B4432E; }

  .wall-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .tabs { display: flex; gap: 8px; }
  .tab {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-soft);
    background: #F7FBFF;
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 7px 15px;
    cursor: pointer;
  }
  .tab.active { color: #fff; background: var(--mint); border-color: var(--mint); }
  .count-badge { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }

  .locked-box {
    text-align: center;
    padding: 46px 20px;
    color: var(--ink-soft);
  }
  .locked-box .lock-emoji { font-size: 40px; display: block; margin-bottom: 10px; }
  .locked-box strong { color: var(--ink); }

  .wall {
    columns: 3 220px;
    column-gap: 16px;
  }
  @media (max-width: 640px) { .wall { columns: 1 220px; } }

  .note {
    break-inside: avoid;
    margin-bottom: 16px;
    border-radius: 6px;
    padding: 18px 16px 14px;
    position: relative;
    box-shadow: 3px 5px 0 rgba(51,65,92,0.08);
  }
  .note::before {
    content: '';
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #E85A45;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .note.c0 { background: var(--note1); transform: rotate(-1.6deg); }
  .note.c1 { background: var(--note2); transform: rotate(1.2deg); }
  .note.c2 { background: var(--note3); transform: rotate(-0.8deg); }
  .note.c3 { background: var(--note4); transform: rotate(1.8deg); }
  .note.c4 { background: var(--note5); transform: rotate(-1.2deg); }
  .note.c5 { background: var(--note6); transform: rotate(0.9deg); }

  .note .note-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    color: rgba(51,65,92,0.7);
    margin-bottom: 8px;
  }
  .note .emoji { font-size: 16px; }
  .note h3 {
    font-family: 'Gaegu', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 6px;
    color: #23324A;
  }
  .note p { margin: 0 0 10px; font-size: 14px; color: #2B3A52; }
  .note .who {
    font-size: 12px;
    font-weight: 700;
    color: rgba(51,65,92,0.65);
  }

  .empty { text-align:center; color: var(--ink-soft); padding: 30px 0; }

  footer {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer .label { font-size: 12.5px; color: var(--ink-soft); }
  .teacher-btn {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    background: #fff;
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
  }
  .teacher-btn:hover { border-color: var(--mint); }
  .reset-link {
    background: none; border: none; color: var(--ink-soft);
    font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span class="kicker">신남연구소 · 현장 기록 프로젝트</span>
    <h1>물질의 상태 변화, 열에너지는 어디로 갈까?</h1>
    <p>우리 주변에서 물질이 상태를 바꿀 때 열에너지가 드나드는 예시를 조사해서 담벼락에 붙여 보세요!
       내가 먼저 하나 붙여야 우리 반 친구들의 포스트잇을 볼 수 있어요.</p>
  </div>

  <div class="card">
    <h2 class="section-title">✏️ 새 포스트잇 붙이기</h2>
    <form id="submitForm">
      <div class="row-grade">
        <div>
          <label for="grade">학년</label>
          <select id="grade" required>
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
          </select>
        </div>
        <div>
          <label for="classNum">반</label>
          <input type="number" id="classNum" min="1" max="20" placeholder="예: 3" required>
        </div>
        <div>
          <label for="number">번호</label>
          <input type="number" id="number" min="1" max="40" placeholder="예: 12">
        </div>
        <div>
          <label for="name">이름</label>
          <input type="text" id="name" placeholder="이름을 입력하세요" required>
        </div>
      </div>

      <div>
        <label for="category">상태변화 유형</label>
        <select id="category" required>
          <option value="" disabled selected>선택하세요</option>
          <option value="융해">융해 (고체 → 액체) — 열에너지를 흡수해서 주위 온도가 낮아짐 ❄️</option>
          <option value="응고">응고 (액체 → 고체) — 열에너지를 방출해서 주위 온도가 높아짐 🔥</option>
          <option value="기화">기화 (액체 → 기체) — 열에너지를 흡수해서 주위 온도가 낮아짐 ❄️</option>
          <option value="액화">액화 (기체 → 액체) — 열에너지를 방출해서 주위 온도가 높아짐 🔥</option>
          <option value="승화(고체→기체)">승화 (고체 → 기체) — 열에너지를 흡수해서 주위 온도가 낮아짐 ❄️</option>
          <option value="승화(기체→고체)">승화 (기체 → 고체) — 열에너지를 방출해서 주위 온도가 높아짐 🔥</option>
        </select>
      </div>

      <div>
        <label for="title">예시 제목</label>
        <input type="text" id="title" placeholder="예: 얼음물이 담긴 컵 표면에 물방울이 맺힌다" required>
      </div>

      <div>
        <label for="content">자세한 설명</label>
        <textarea id="content" placeholder="어떤 상태변화가 일어나는지, 열에너지가 어느 방향으로 이동하는지, 그 결과 주변에 어떤 변화가 나타나는지를 완결된 문장으로 적어 주세요." required></textarea>
        <div class="hint">완결된 문장으로, 실제로 관찰했거나 알고 있는 현상을 근거로 적어 주세요.</div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">AI 검토 후 담벼락에 붙이기</button>
      <div class="result-banner" id="resultBanner"></div>
    </form>
  </div>

  <div class="card">
    <div class="wall-head">
      <h2 class="section-title" id="wallTitle" style="margin-bottom:0;">🧑‍🔬 우리 반 담벼락</h2>
      <span class="count-badge" id="entryCount"></span>
    </div>
    <div class="tabs" id="tabs" style="display:none;">
      <button class="tab active" data-filter="all">전체</button>
      <button class="tab" data-filter="absorb">❄️ 온도가 낮아짐</button>
      <button class="tab" data-filter="release">🔥 온도가 높아짐</button>
    </div>

    <div id="lockedBox" class="locked-box">
      <span class="lock-emoji">🔒</span>
      <strong>먼저 내 포스트잇을 하나 붙여 주세요!</strong><br>
      제출하면 우리 반 친구들이 조사한 담벼락이 열려요.
    </div>
    <div id="wall" class="wall" style="display:none;"></div>
  </div>

  <footer>
    <span class="label">신남연구소 열에너지 현장 기록 · <button class="reset-link" id="resetLink">다른 반으로 다시 시작</button></span>
    <button type="button" class="teacher-btn" onclick="location.href='teacher.html'">교사용 화면 →</button>
  </footer>

</div>

<script>
  // ⚠️ Apps Script 웹 앱 배포 후 생성된 /exec 주소를 아래에 붙여넣으세요.
  const API_URL = 'https://script.google.com/macros/s/AKfycbya_RMwRf4ni_muETyWXVTJB6MacgwheHudeH-OIBGOfG__lxB6XcAXllNkvQDjTO1ZZg/exec';

  const RELEASE_TYPES = new Set(['응고', '액화', '승화(기체→고체)']);
  const NOTE_COLORS = ['c0', 'c1', 'c2', 'c3', 'c4', 'c5'];

  function thermalClass(category) { return RELEASE_TYPES.has(category) ? 'release' : 'absorb'; }
  function thermalEmoji(category) { return RELEASE_TYPES.has(category) ? '🔥' : '❄️'; }
  function escapeHtml(str) {
    return (str || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  let allEntries = [];
  let currentFilter = 'all';
  let myClass = localStorage.getItem('snlab_myClass') || '';

  function buildClassKey() {
    const grade = document.getElementById('grade').value;
    const classNum = document.getElementById('classNum').value.trim();
    return grade + '학년 ' + classNum + '반';
  }

  async function loadWall(classKey) {
    const wallEl = document.getElementById('wall');
    document.getElementById('wallTitle').textContent = '🧑‍🔬 ' + classKey + ' 담벼락';
    document.getElementById('lockedBox').style.display = 'none';
    document.getElementById('tabs').style.display = 'flex';
    wallEl.style.display = 'block';
    wallEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    try {
      const res = await fetch(API_URL + '?action=list&classInfo=' + encodeURIComponent(classKey));
      const data = await res.json();
      allEntries = data.items || [];
      renderWall();
    } catch (err) {
      wallEl.innerHTML = '<div class="empty">담벼락을 불러오지 못했습니다. 잠시 후 새로고침 해보세요.</div>';
    }
  }

  function renderWall() {
    const wallEl = document.getElementById('wall');
    const countEl = document.getElementById('entryCount');
    const filtered = currentFilter === 'all'
      ? allEntries
      : allEntries.filter(e => thermalClass(e.category) === currentFilter);

    countEl.textContent = filtered.length + '장';

    if (filtered.length === 0) {
      wallEl.innerHTML = '<div class="empty">아직 붙은 포스트잇이 없어요. 첫 주인공이 되어 보세요!</div>';
      return;
    }

    wallEl.innerHTML = filtered.map((e, i) => {
      const colorCls = NOTE_COLORS[i % NOTE_COLORS.length];
      const who = [e.number ? e.number + '번' : '', e.name].filter(Boolean).join(' ');
      return `
        <div class="note ${colorCls}">
          <div class="note-top"><span>${escapeHtml(e.category)}</span><span class="emoji">${thermalEmoji(e.category)}</span></div>
          <h3>${escapeHtml(e.title)}</h3>
          <p>${escapeHtml(e.content)}</p>
          <div class="who">${escapeHtml(who)}</div>
        </div>`;
    }).join('');
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    if (!e.target.classList.contains('tab')) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    renderWall();
  });

  document.getElementById('resetLink').addEventListener('click', () => {
    localStorage.removeItem('snlab_myClass');
    localStorage.removeItem('snlab_hasSubmitted');
    location.reload();
  });

  document.getElementById('submitForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const banner = document.getElementById('resultBanner');
    banner.className = 'result-banner';
    banner.textContent = '';

    const classKey = buildClassKey();
    const payload = {
      action: 'submit',
      classInfo: classKey,
      number: document.getElementById('number').value.trim(),
      name: document.getElementById('name').value.trim(),
      category: document.getElementById('category').value,
      title: document.getElementById('title').value.trim(),
      content: document.getElementById('content').value.trim()
    };

    btn.disabled = true;
    btn.textContent = 'AI가 검토 중입니다...';

    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      const data = await res.json();

      if (!data.success) {
        banner.classList.add('reject');
        banner.textContent = data.message || '제출 중 문제가 발생했습니다.';
      } else if (data.approved) {
        banner.classList.add('approve');
        banner.textContent = '담벼락에 붙었어요! ' + (data.feedback || '');
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        document.getElementById('category').value = '';
        localStorage.setItem('snlab_hasSubmitted', 'true');
        localStorage.setItem('snlab_myClass', classKey);
        myClass = classKey;
        loadWall(classKey);
      } else {
        banner.classList.add('reject');
        banner.textContent = '아직 부족해요. ' + (data.feedback || '내용을 다시 확인해 보세요.');
      }
    } catch (err) {
      banner.classList.add('reject');
      banner.textContent = '네트워크 오류로 제출하지 못했습니다. 잠시 후 다시 시도해 주세요.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'AI 검토 후 담벼락에 붙이기';
    }
  });

  if (myClass) {
    loadWall(myClass);
  }
</script>
</body>
</html>
