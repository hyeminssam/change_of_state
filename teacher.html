<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사용 · 신남연구소 열에너지 담벼락</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F9FF;
    --ink: #33415C;
    --ink-soft: #7186A6;
    --line: #DCEAFB;
    --card: #FFFFFF;
    --coral: #FF6F59;
    --mint: #2EC4B6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 34px 18px 90px; }

  .hero {
    background: linear-gradient(135deg, #6FD6E8 0%, #8FE3C0 100%);
    border-radius: 24px;
    padding: 26px 26px;
    color: #17384A;
    margin-bottom: 26px;
  }
  .hero .kicker {
    font-weight: 700; font-size: 13px;
    background: rgba(255,255,255,0.55);
    display: inline-block; padding: 4px 12px; border-radius: 999px; margin-bottom: 10px;
  }
  .hero h1 { font-family: 'Gaegu', sans-serif; font-size: 27px; margin: 0; }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px 22px;
    box-shadow: 0 4px 0 var(--line);
  }

  #gate { display: grid; gap: 12px; max-width: 320px; }
  #gate label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  #gate input {
    font-family: inherit; font-size: 15px; padding: 11px 13px;
    background: #F7FBFF; border: 2px solid var(--line); border-radius: 12px; color: var(--ink);
  }
  #gate input:focus { outline: none; border-color: var(--mint); }
  #gate button {
    font-family: inherit; font-weight: 900; font-size: 14.5px;
    background: var(--coral); color: #fff; border: none; border-radius: 999px;
    padding: 12px 20px; cursor: pointer; justify-self: start;
  }
  #gate button:disabled { opacity: 0.55; }
  .error-msg { color: #B4432E; font-size: 13.5px; display: none; font-weight: 700; }
  .error-msg.show { display: block; }

  #dashboard { display: none; }
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; margin-bottom: 18px;
  }
  select.class-select {
    font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink);
    background: #F7FBFF; border: 2px solid var(--line); border-radius: 999px;
    padding: 9px 14px;
  }
  .refresh-btn {
    font-family: inherit; font-weight: 700; font-size: 13.5px;
    background: #fff; color: var(--ink); border: 2px solid var(--line);
    border-radius: 999px; padding: 9px 16px; cursor: pointer;
  }
  .refresh-btn:hover { border-color: var(--mint); }
  .stat-line { font-size: 13.5px; color: var(--ink-soft); font-weight: 700; margin-bottom: 14px; }

  .summary {
    background: #F7FBFF;
    border-left: 4px solid var(--mint);
    border-radius: 12px;
    padding: 20px 20px;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .loading { color: var(--ink-soft); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="kicker">신남연구소 · 현장 기록 프로젝트</span>
    <h1>교사용 수업 자료 정리</h1>
  </div>

  <div class="card">
    <div id="gate">
      <label for="pw">비밀번호</label>
      <input type="password" id="pw" placeholder="교사용 비밀번호">
      <button id="unlockBtn">불러오기</button>
      <div class="error-msg" id="gateError"></div>
    </div>

    <div id="dashboard">
      <div class="controls">
        <select class="class-select" id="classSelect">
          <option value="">전체 반</option>
        </select>
        <button class="refresh-btn" id="refreshBtn">다시 분석하기</button>
      </div>
      <div class="stat-line" id="statCount"></div>
      <div class="summary" id="summaryArea"><div class="loading">Gemini가 학생 제출물을 정리하는 중입니다...</div></div>
    </div>
  </div>
</div>

<script>
  // ⚠️ Apps Script 웹 앱 배포 후 생성된 /exec 주소를 아래에 붙여넣으세요.
  const API_URL = 'https://script.google.com/macros/s/AKfycbwunt1Q5HhEtftXb8T5kV1CmZCVJjxOeZtA6m_vD0XsDwpts8TSf-h2LJ_H2nWx1qHSSg/exec';

  let savedPassword = '';

  async function fetchSummary(password, classInfo) {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'teacherSummary', password: password, classInfo: classInfo || '' })
    });
    return res.json();
  }

  function populateClassSelect(classes, selected) {
    const sel = document.getElementById('classSelect');
    sel.innerHTML = '<option value="">전체 반</option>' +
      (classes || []).map(c => `<option value="${c}">${c}</option>`).join('');
    sel.value = selected || '';
  }

  function renderSummary(data, classInfo) {
    populateClassSelect(data.classes, classInfo);
    document.getElementById('statCount').textContent =
      (classInfo || '전체 반') + ' · 승인된 제출물 ' + data.count + '건';
    document.getElementById('summaryArea').textContent = data.summary || '';
  }

  document.getElementById('unlockBtn').addEventListener('click', async () => {
    const pw = document.getElementById('pw').value;
    const btn = document.getElementById('unlockBtn');
    const errorEl = document.getElementById('gateError');
    errorEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = '확인 중...';

    try {
      const data = await fetchSummary(pw, '');
      if (!data.success) {
        errorEl.textContent = data.message || '불러오지 못했습니다.';
        errorEl.classList.add('show');
        return;
      }
      savedPassword = pw;
      document.getElementById('gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      renderSummary(data, '');
    } catch (err) {
      errorEl.textContent = '네트워크 오류가 발생했습니다.';
      errorEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = '불러오기';
    }
  });

  document.getElementById('classSelect').addEventListener('change', async (e) => {
    document.getElementById('summaryArea').innerHTML = '<div class="loading">Gemini가 정리하는 중입니다...</div>';
    const data = await fetchSummary(savedPassword, e.target.value);
    if (data.success) renderSummary(data, e.target.value);
  });

  document.getElementById('refreshBtn').addEventListener('click', async () => {
    const btn = document.getElementById('refreshBtn');
    const classInfo = document.getElementById('classSelect').value;
    document.getElementById('summaryArea').innerHTML = '<div class="loading">Gemini가 다시 분석하는 중입니다...</div>';
    btn.disabled = true;
    try {
      const data = await fetchSummary(savedPassword, classInfo);
      if (data.success) renderSummary(data, classInfo);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
