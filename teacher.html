<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사용 · 신남연구소 열에너지 담벼락</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F9FF;
    --ink: #33415C;
    --ink-soft: #7186A6;
    --line: #DCEAFB;
    --card: #FFFFFF;
    --coral: #FF6F59;
    --mint: #2EC4B6;
    --note1: #FFF3B0; --note2: #FFD6E8; --note3: #C7F3DE;
    --note4: #CFE8FF; --note5: #E7DBFF; --note6: #FFDDB3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 34px 18px 90px; }

  .hero {
    background: linear-gradient(135deg, #6FD6E8 0%, #8FE3C0 100%);
    border-radius: 24px;
    padding: 26px 26px;
    color: #17384A;
    margin-bottom: 26px;
  }
  .hero .kicker {
    font-weight: 700; font-size: 13px;
    background: rgba(255,255,255,0.55);
    display: inline-block; padding: 4px 12px; border-radius: 999px; margin-bottom: 10px;
  }
  .hero h1 { font-family: 'Gaegu', sans-serif; font-size: 27px; margin: 0; }
  .fullscreen-btn {
    font-family: inherit; font-weight: 700; font-size: 13px;
    background: rgba(255,255,255,0.6); color: #17384A;
    border: none; border-radius: 999px; padding: 8px 15px;
    cursor: pointer; margin-top: 14px;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px 22px;
    box-shadow: 0 4px 0 var(--line);
    margin-bottom: 26px;
  }
  h2.section-title {
    font-family: 'Gaegu', sans-serif;
    font-size: 21px; font-weight: 700; margin: 0 0 16px; color: var(--ink);
  }

  #gate { display: grid; gap: 12px; max-width: 320px; }
  #gate label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  #gate input {
    font-family: inherit; font-size: 15px; padding: 11px 13px;
    background: #F7FBFF; border: 2px solid var(--line); border-radius: 12px; color: var(--ink);
  }
  #gate input:focus { outline: none; border-color: var(--mint); }
  #gate button {
    font-family: inherit; font-weight: 900; font-size: 14.5px;
    background: var(--coral); color: #fff; border: none; border-radius: 999px;
    padding: 12px 20px; cursor: pointer; justify-self: start;
  }
  #gate button:disabled { opacity: 0.55; }
  .error-msg { color: #B4432E; font-size: 13.5px; display: none; font-weight: 700; }
  .error-msg.show { display: block; }

  #dashboard { display: none; }
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; margin-bottom: 18px;
  }
  select.class-select {
    font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink);
    background: #F7FBFF; border: 2px solid var(--line); border-radius: 999px;
    padding: 9px 14px;
  }
  .refresh-btn {
    font-family: inherit; font-weight: 700; font-size: 13.5px;
    background: #fff; color: var(--ink); border: 2px solid var(--line);
    border-radius: 999px; padding: 9px 16px; cursor: pointer;
  }
  .refresh-btn:hover { border-color: var(--mint); }
  .stat-line { font-size: 15px; color: var(--ink-soft); font-weight: 700; margin-bottom: 16px; }

  .summary-section { margin-bottom: 22px; }
  .summary-section h3 {
    font-family: 'Gaegu', sans-serif;
    font-size: 22px; margin: 0 0 10px; color: var(--ink);
  }
  .summary-section ul { margin: 0; padding-left: 24px; }
  .summary-section li {
    font-size: 18px; margin-bottom: 10px; color: #2B3A52; line-height: 1.55;
  }
  .summary-box {
    background: #F7FBFF;
    border-left: 5px solid var(--mint);
    border-radius: 12px;
    padding: 20px 24px;
  }
  .loading { color: var(--ink-soft); font-size: 15px; }

  .live-head { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .live-dot {
    width:9px; height:9px; border-radius:50%; background: #E85A45;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .live-label { font-size: 13px; color: var(--ink-soft); font-weight:700; }

  .wall { columns: 2 280px; column-gap: 16px; }
  @media (max-width: 640px) { .wall { columns: 1 240px; } }
  .class-group { margin-bottom: 26px; }
  .class-group:last-child { margin-bottom: 0; }
  .class-group-title {
    font-family: 'Gaegu', sans-serif;
    font-size: 19px;
    margin: 0 0 12px;
    color: var(--ink);
    border-bottom: 2px dashed var(--line);
    padding-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .class-count { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
  .note {
    break-inside: avoid; margin-bottom: 16px; border-radius: 8px;
    padding: 20px 18px 15px; position: relative;
    box-shadow: 3px 5px 0 rgba(51,65,92,0.08);
  }
  .note::before {
    content: ''; position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: #E85A45;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .note.c0 { background: var(--note1); } .note.c1 { background: var(--note2); }
  .note.c2 { background: var(--note3); } .note.c3 { background: var(--note4); }
  .note.c4 { background: var(--note5); } .note.c5 { background: var(--note6); }
  .note .note-top {
    display:flex; justify-content:space-between; align-items:center;
    font-size: 13px; font-weight:700; color: rgba(51,65,92,0.7); margin-bottom: 8px;
  }
  .note .class-tag {
    font-size: 10.5px; font-weight:700; color: rgba(51,65,92,0.55);
    margin-bottom: 4px;
  }
  .note h3 {
    font-family: 'Gaegu', sans-serif; font-size: 20px; font-weight:700;
    margin: 0 0 7px; color: #23324A;
  }
  .note p { margin: 0 0 10px; font-size: 16px; color: #2B3A52; line-height:1.5; }
  .note .note-bottom {
    display:flex; justify-content:space-between; align-items:center;
  }
  .note .who { font-size: 13px; font-weight:700; color: rgba(51,65,92,0.65); }
  .del-btn {
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    background: rgba(180,67,46,0.12); color: #B4432E;
    border: none; border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .del-btn:hover { background: rgba(180,67,46,0.22); }
  .empty { text-align:center; color: var(--ink-soft); padding: 24px 0; grid-column: 1/-1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="kicker">신남연구소 · 현장 기록 프로젝트</span>
    <h1>교사용 대시보드</h1>
    <br>
    <button class="fullscreen-btn" id="fullscreenBtn">🖥️ 전체화면으로 보기</button>
  </div>

  <div class="card">
    <div id="gate">
      <label for="pw">비밀번호</label>
      <input type="password" id="pw" placeholder="교사용 비밀번호">
      <button id="unlockBtn">불러오기</button>
      <div class="error-msg" id="gateError"></div>
    </div>

    <div id="dashboard">
      <div class="controls">
        <select class="class-select" id="classSelect">
          <option value="">전체 반</option>
        </select>
        <button class="refresh-btn" id="refreshBtn">AI 요약 다시 분석하기</button>
      </div>
      <div class="stat-line" id="statCount"></div>
      <div id="summaryArea"><div class="loading">Gemini가 학생 제출물을 정리하는 중입니다...</div></div>
    </div>
  </div>

  <div class="card" id="liveCard" style="display:none;">
    <div class="live-head">
      <span class="live-dot"></span>
      <h2 class="section-title" style="margin-bottom:0;">📌 실시간 담벼락</h2>
      <span class="live-label">8초마다 자동 새로고침</span>
    </div>
    <div id="liveWall"><div class="empty">불러오는 중...</div></div>
  </div>
</div>

<script>
  // ⚠️ Apps Script 웹 앱 배포 후 생성된 /exec 주소를 아래에 붙여넣으세요.
  const API_URL = 'https://script.google.com/macros/s/AKfycbwkljLMkwED0wWT1TsNsS_uQWmOwCUEBNASx4QIkW30YZvWnFKZimYXWfJj4mvGFq-FVg/exec';
  const NOTE_COLORS = ['c0','c1','c2','c3','c4','c5'];

  let savedPassword = '';

  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
      document.getElementById('fullscreenBtn').textContent = '↩️ 전체화면 나가기';
    } else {
      document.exitFullscreen();
      document.getElementById('fullscreenBtn').textContent = '🖥️ 전체화면으로 보기';
    }
  });
  document.addEventListener('fullscreenchange', () => {
    document.getElementById('fullscreenBtn').textContent =
      document.fullscreenElement ? '↩️ 전체화면 나가기' : '🖥️ 전체화면으로 보기';
  });

  function escapeHtml(str) {
    return (str || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---------- AI 요약 ----------
  async function fetchSummary(password, classInfo) {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'teacherSummary', password: password, classInfo: classInfo || '' })
    });
    return res.json();
  }

  function populateClassSelect(classes, selected) {
    const sel = document.getElementById('classSelect');
    sel.innerHTML = '<option value="">전체 반</option>' +
      (classes || []).map(c => `<option value="${c}">${c}</option>`).join('');
    sel.value = selected || '';
  }

  function renderSummary(data, classInfo) {
    populateClassSelect(data.classes, classInfo);
    document.getElementById('statCount').textContent =
      (classInfo || '전체 반') + ' · 승인된 제출물 ' + data.count + '건';

    const area = document.getElementById('summaryArea');
    const sections = data.sections || [];
    if (sections.length === 0) {
      area.innerHTML = '<div class="summary-box">정리할 내용이 없습니다.</div>';
      return;
    }
    area.innerHTML = sections.map(sec => `
      <div class="summary-section">
        <h3>${escapeHtml(sec.heading || '')}</h3>
        <div class="summary-box">
          <ul>${(sec.items || []).map(it => `<li>${escapeHtml(it)}</li>`).join('')}</ul>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('unlockBtn').addEventListener('click', async () => {
    const pw = document.getElementById('pw').value;
    const btn = document.getElementById('unlockBtn');
    const errorEl = document.getElementById('gateError');
    errorEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = '확인 중...';

    try {
      const data = await fetchSummary(pw, '');
      if (!data.success) {
        errorEl.textContent = data.message || '불러오지 못했습니다.';
        errorEl.classList.add('show');
        return;
      }
      savedPassword = pw;
      document.getElementById('gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('liveCard').style.display = 'block';
      renderSummary(data, '');
      refreshLiveWall();
      setInterval(refreshLiveWall, 8000);
    } catch (err) {
      errorEl.textContent = '네트워크 오류가 발생했습니다.';
      errorEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = '불러오기';
    }
  });

  document.getElementById('classSelect').addEventListener('change', async (e) => {
    document.getElementById('summaryArea').innerHTML = '<div class="loading">Gemini가 정리하는 중입니다...</div>';
    const data = await fetchSummary(savedPassword, e.target.value);
    if (data.success) renderSummary(data, e.target.value);
    refreshLiveWall();
  });

  document.getElementById('refreshBtn').addEventListener('click', async () => {
    const btn = document.getElementById('refreshBtn');
    const classInfo = document.getElementById('classSelect').value;
    document.getElementById('summaryArea').innerHTML = '<div class="loading">Gemini가 다시 분석하는 중입니다...</div>';
    btn.disabled = true;
    try {
      const data = await fetchSummary(savedPassword, classInfo);
      if (data.success) renderSummary(data, classInfo);
    } finally {
      btn.disabled = false;
    }
  });

  // ---------- 실시간 담벼락 ----------
  async function refreshLiveWall() {
    const classInfo = document.getElementById('classSelect').value;
    const wallEl = document.getElementById('liveWall');
    try {
      const url = API_URL + '?action=list' + (classInfo ? '&classInfo=' + encodeURIComponent(classInfo) : '');
      const res = await fetch(url);
      const data = await res.json();
      renderLiveWall(data.items || [], classInfo);
    } catch (err) {
      wallEl.innerHTML = '<div class="empty">담벼락을 불러오지 못했습니다.</div>';
    }
  }

  function notesHtml(items) {
    return items.map((e, i) => {
      const colorCls = NOTE_COLORS[i % NOTE_COLORS.length];
      const who = [e.number ? e.number + '번' : '', e.name].filter(Boolean).join(' ');
      return `
        <div class="note ${colorCls}">
          <div class="note-top"><span>${escapeHtml(e.category)}</span></div>
          <h3>${escapeHtml(e.title)}</h3>
          <p>${escapeHtml(e.content)}</p>
          <div class="note-bottom">
            <span class="who">${escapeHtml(who)}</span>
            <button class="del-btn" data-id="${e.id}">삭제</button>
          </div>
        </div>`;
    }).join('');
  }

  function renderLiveWall(items, classFilter) {
    const wallEl = document.getElementById('liveWall');
    if (items.length === 0) {
      wallEl.innerHTML = '<div class="empty">아직 붙은 포스트잇이 없어요.</div>';
      return;
    }

    if (classFilter) {
      // 특정 반만 볼 때는 그냥 하나의 담벼락으로
      wallEl.innerHTML = `<div class="wall">${notesHtml(items)}</div>`;
      return;
    }

    // 전체 반일 때는 반별로 묶어서 각각의 담벼락으로 표시
    const groups = {};
    items.forEach(it => {
      const key = it.classInfo || '(반 미기재)';
      (groups[key] = groups[key] || []).push(it);
    });
    const classNames = Object.keys(groups).sort();

    wallEl.innerHTML = classNames.map(cls => `
      <div class="class-group">
        <div class="class-group-title">
          <span>🧑‍🔬 ${escapeHtml(cls)}</span>
          <span class="class-count">${groups[cls].length}장</span>
        </div>
        <div class="wall">${notesHtml(groups[cls])}</div>
      </div>
    `).join('');
  }

  document.getElementById('liveWall').addEventListener('click', async (e) => {
    if (!e.target.classList.contains('del-btn')) return;
    if (!confirm('이 포스트잇을 삭제할까요? 되돌릴 수 없어요.')) return;
    const id = e.target.dataset.id;
    e.target.disabled = true;
    e.target.textContent = '삭제 중...';
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', password: savedPassword, id: id })
      });
      const data = await res.json();
      if (data.success) {
        refreshLiveWall();
      } else {
        alert(data.message || '삭제하지 못했습니다.');
        e.target.disabled = false;
        e.target.textContent = '삭제';
      }
    } catch (err) {
      alert('네트워크 오류로 삭제하지 못했습니다.');
      e.target.disabled = false;
      e.target.textContent = '삭제';
    }
  });
</script>
</body>
</html>
